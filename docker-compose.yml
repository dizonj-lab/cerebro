# Simpler alternative to Kubernetes for a quick local run.
#
#   docker compose up --build       then open http://localhost:3000
#
# Host ports are configurable, because 3000, 8000 and 5432 are all commonly
# taken (OpenWebUI, another API, a local PostgreSQL). Override per run:
#
#   CEREBRO_WEB_PORT=3100 docker compose up --build
#
# or set them once in a .env file beside this one — compose reads it
# automatically. See .env.example. Only the host side moves; nothing inside the
# containers changes, and no rebuild is needed, because the browser reaches the
# API through the web origin rather than a hard-coded port.
#
# Kubernetes (k8s/) is the primary target; see k8s/README.md.
#
# The browser only ever talks to the web service: Next.js proxies /api to the
# API container (see frontend/next.config.ts). The API port is published only so
# you can inspect it directly — the app does not need it.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cerebro
      POSTGRES_USER: cerebro
      POSTGRES_PASSWORD: cerebro_dev_password
    volumes:
    - postgres-data:/var/lib/postgresql/data
    ports:
    - ${CEREBRO_DB_PORT:-5432}:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U cerebro -d cerebro
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: ./backend
    command:
    - alembic
    - upgrade
    - head
    environment:
      CEREBRO_DATABASE_URL: postgresql+psycopg://cerebro:cerebro_dev_password@postgres:5432/cerebro
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  api:
    build:
      context: ./backend
    environment:
      CEREBRO_DATABASE_URL: postgresql+psycopg://cerebro:cerebro_dev_password@postgres:5432/cerebro
      CEREBRO_ENVIRONMENT: development
      CEREBRO_STORAGE_BACKEND: ${CEREBRO_STORAGE_BACKEND:-filesystem}
      CEREBRO_S3_ENDPOINT: minio:9000
      CEREBRO_S3_BUCKET: cerebro-artifacts
      CEREBRO_S3_ACCESS_KEY: cerebro
      CEREBRO_S3_SECRET_KEY: cerebro_dev_password
      CEREBRO_STORAGE_PATH: /data/artifacts
      # Local AI, off unless you ask for it. Set these in a .env file beside
      # this one; see .env.example.
      #
      # host.docker.internal is not a nicety here: inside this container,
      # localhost is the container, so a default of localhost:11434 would
      # reach nothing while appearing configured. extra_hosts below makes the
      # same name work on Linux, where Docker does not provide it.
      CEREBRO_ENRICHMENT_LLM: ${CEREBRO_ENRICHMENT_LLM:-none}
      CEREBRO_RECALL_LLM: ${CEREBRO_RECALL_LLM:-none}
      CEREBRO_OLLAMA_RECALL_MODEL: ${CEREBRO_OLLAMA_RECALL_MODEL:-llama3.2}
      CEREBRO_EMBEDDING_PROVIDER: ${CEREBRO_EMBEDDING_PROVIDER:-hashing}
      CEREBRO_OLLAMA_BASE_URL: ${CEREBRO_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CEREBRO_OLLAMA_ENRICHMENT_MODEL: ${CEREBRO_OLLAMA_ENRICHMENT_MODEL:-llama3.2}
      CEREBRO_OLLAMA_EMBEDDING_MODEL: ${CEREBRO_OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      CEREBRO_OLLAMA_EMBEDDING_DIMENSIONS: ${CEREBRO_OLLAMA_EMBEDDING_DIMENSIONS:-768}
    extra_hosts:
    - host.docker.internal:host-gateway
    ports:
    - ${CEREBRO_API_PORT:-8000}:8000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200
        else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
    - artifact-data:/data/artifacts
  web:
    build:
      context: ./frontend
    environment:
      INTERNAL_API_BASE_URL: http://api:8000
    ports:
    - ${CEREBRO_WEB_PORT:-3000}:3000
    depends_on:
      api:
        condition: service_healthy
  minio:
    # No usable default exists: see docs/DEVELOPMENT.md for what was checked.
    # A `${VAR:?}` guard is not used here because Compose interpolates every
    # service even when the profile is off, which would break the default
    # `docker compose up`. The placeholder fails at pull time instead, naming
    # the variable to set.
    image: ${CEREBRO_MINIO_IMAGE:-set-CEREBRO_MINIO_IMAGE-see-docs-DEVELOPMENT-md}
    command:
    - server
    - /data
    - --console-address
    - :9001
    environment:
      MINIO_ROOT_USER: cerebro
      MINIO_ROOT_PASSWORD: cerebro_dev_password
    volumes:
    - minio-data:/data
    ports:
    - ${CEREBRO_S3_PORT:-9000}:9000
    - ${CEREBRO_S3_CONSOLE_PORT:-9001}:9001
    healthcheck:
      test:
      - CMD-SHELL
      - mc ready local || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
    profiles:
    - minio
volumes:
  postgres-data: null
  minio-data: null
  artifact-data: null
