# Simpler alternative to Kubernetes for a quick local run.
#
#   docker compose up --build       then open http://localhost:3000
#
# Kubernetes (k8s/) is the primary target; see k8s/README.md.
#
# The browser only ever talks to the web service: Next.js proxies /api to the
# API container (see frontend/next.config.ts). The API port is published only so
# you can inspect it directly — the app does not need it.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cerebro
      POSTGRES_USER: cerebro
      POSTGRES_PASSWORD: cerebro_dev_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerebro -d cerebro"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      CEREBRO_DATABASE_URL: postgresql+psycopg://cerebro:cerebro_dev_password@postgres:5432/cerebro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      CEREBRO_DATABASE_URL: postgresql+psycopg://cerebro:cerebro_dev_password@postgres:5432/cerebro
      CEREBRO_ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ./frontend
    environment:
      # Both server-side rendering and the /api proxy target this.
      INTERNAL_API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
