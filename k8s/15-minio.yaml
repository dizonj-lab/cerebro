apiVersion: v1
kind: Secret
metadata:
  name: cerebro-minio
  namespace: cerebro
  labels:
    app.kubernetes.io/name: cerebro-minio
    app.kubernetes.io/part-of: cerebro
type: Opaque
stringData:
  # Local development values. Replace before any shared deployment.
  MINIO_ROOT_USER: cerebro
  MINIO_ROOT_PASSWORD: cerebro_dev_password
---
apiVersion: v1
kind: Service
metadata:
  name: cerebro-minio
  namespace: cerebro
  labels:
    app.kubernetes.io/name: cerebro-minio
    app.kubernetes.io/part-of: cerebro
spec:
  selector:
    app.kubernetes.io/name: cerebro-minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cerebro-minio
  namespace: cerebro
  labels:
    app.kubernetes.io/name: cerebro-minio
    app.kubernetes.io/part-of: cerebro
spec:
  serviceName: cerebro-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cerebro-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cerebro-minio
        app.kubernetes.io/part-of: cerebro
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: minio
          # Replace before applying. minio/minio is 404 on Docker Hub and
          # quay.io/minio/minio returns 401; see docs/DEVELOPMENT.md for what
          # was verified. This manifest is not applied by default.
          image: REPLACE_ME_WITH_A_PULLABLE_S3_IMAGE
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          envFrom:
            - secretRef:
                name: cerebro-minio
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
